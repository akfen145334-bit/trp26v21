<body>
<header class="topbar">
  <a href="#/" class="brand"><span class="logo">VK</span><span>Vize Kampı</span></a>
  <nav class="topnav">
    <a href="#/" data-nav="home">Dersler</a>
    <a href="#/eksikler" data-nav="eksik">Eksiklerim</a>
  </nav>
  <button class="userchip" id="userchip" type="button" aria-label="Kullanıcı"></button>
</header>
<main id="app" tabindex="-1"></main>
<div id="ttsbar" class="ttsbar hidden" role="region" aria-label="Sesli okuma">
  <div class="ttsinfo"><span class="dot"></span><span id="ttstitle">Okunuyor…</span></div>
  <div class="ttsctl">
    <button type="button" id="ttsPause" title="Duraklat / devam">⏯</button>
    <label class="rate">Hız <select id="ttsRate"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.2">1.2×</option><option value="1.4">1.4×</option></select></label>
    <button type="button" id="ttsStop" title="Durdur">⏹</button>
  </div>
</div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
<div id="lightbox" class="lightbox hidden"><img alt=""><p></p></div>
<script src="data/courses.js"></script>
<script src="js/app.js"></script>
</body>
</html>
